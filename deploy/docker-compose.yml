# Docker Compose V2 不再需要 version 字段
name: translation

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-12-18T00-00-00Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 关闭 oneDNN/MKL-DNN：避免 Paddle 3.x 在某些 CPU 上的算子不兼容
      # 必须由容器启动注入（早于 Python 解释器启动），.env 里设置生效太晚
      FLAGS_use_mkldnn: "false"
      FLAGS_use_onednn: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8000:8000"
    # 生产环境：不挂载源码卷，使用镜像内代码；不启用 --reload
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      FLAGS_use_mkldnn: "false"
      FLAGS_use_onednn: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    # 生产环境：不挂载源码卷，仅保留 PaddleOCR 模型缓存
    volumes:
      # PaddleOCR 模型缓存：避免容器重建时重复下载 1GB+ 模型
      - paddle_models:/root/.paddlex
    # Celery worker 并发数：设为较高值，实际翻译并发由应用层
    # system_config.max_concurrency（管理员后台可调）控制
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=info", "--concurrency=4"]

  beat:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      FLAGS_use_mkldnn: "false"
      FLAGS_use_onednn: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    # 生产环境：不挂载源码卷
    command: ["celery", "-A", "app.tasks.celery_app", "beat", "--loglevel=info"]

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pg_data:
  minio_data:
  # PaddleOCR 11 个模型 ~1.1GB，独立卷避免随容器重建被擦
  paddle_models:
