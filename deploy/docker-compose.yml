# Docker Compose V2 不再需要 version 字段
name: translation

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      # 仅绑定本机回环：容器间走 docker 内部网络，宿主机上运维用 localhost，
      # 内网其它机器不可直连（此前 0.0.0.0 全网可达，法律文档数据裸奔）
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # requirepass：broker 可注入任意 Celery 任务，必须设密码
    # appendonly：持久化任务队列——否则 Redis 重启后已入队消息全丢，
    # DB 里的任务永远卡在"排队中"无人消费
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD}' --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-12-18T00-00-00Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 关闭 oneDNN/MKL-DNN：避免 Paddle 3.x 在某些 CPU 上的算子不兼容
      # 必须由容器启动注入（早于 Python 解释器启动），.env 里设置生效太晚
      FLAGS_use_mkldnn: "false"
      FLAGS_use_onednn: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      # 仅本机回环：外部访问一律经 frontend nginx 反代（8080），
      # 不再把 FastAPI/Swagger 直接暴露到内网
      - "127.0.0.1:8000:8000"
    # 生产环境：不挂载源码卷，使用镜像内代码；不启用 --reload
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      FLAGS_use_mkldnn: "false"
      FLAGS_use_onednn: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    # 生产环境：不挂载源码卷，仅保留 PaddleOCR 模型缓存
    volumes:
      # PaddleOCR 模型缓存：避免容器重建时重复下载 1GB+ 模型
      - paddle_models:/root/.paddlex
    # Celery worker 并发数：设为较高值，实际翻译并发由应用层
    # system_config.max_concurrency（管理员后台可调）控制
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=info", "--concurrency=4"]

  beat:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      FLAGS_use_mkldnn: "false"
      FLAGS_use_onednn: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    # 生产环境：不挂载源码卷
    command: ["celery", "-A", "app.tasks.celery_app", "beat", "--loglevel=info"]

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"
    # 启用 HTTPS 时取消下方注释，挂载 SSL 证书目录 + 映射 443
    # volumes:
    #   - ../deploy/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend

volumes:
  pg_data:
  minio_data:
  # Redis AOF 持久化：保住已入队未执行的 Celery 消息
  redis_data:
  # PaddleOCR 11 个模型 ~1.1GB，独立卷避免随容器重建被擦
  paddle_models:
