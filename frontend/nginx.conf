server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 反代到后端
    location /api/ {
        # Docker 内置 DNS（127.0.0.11）+ 变量：强制 nginx 运行时按需重新解析
        # backend 的容器 IP。否则 nginx 仅在启动时解析一次并永久缓存，后端容器
        # 重启换 IP 后会一直打旧 IP → 502 Bad Gateway（2026-06-26 线上故障根因）。
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_host backend;
        # 用变量后不能再依赖 location 的 URI 映射，改用 $request_uri 透传完整原始路径
        # （后端路由本就全在 /api/ 下，语义与原 proxy_pass .../api/ 一致）。
        proxy_pass http://$backend_host:8000$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 500m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
